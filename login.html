<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>MMEA / APMM · Sign in</title>
  <link rel="stylesheet" href="login.css">
  <script src="access-session.js"></script>
  <script src="login.js" defer></script>
</head>
<body><div class="lgViewport"><main class="scene lgScene" id="main">
  <img class="lgWallFallback" id="wall-source" src="media/login-scene/wall-reference.webp" alt="">
  <img class="lgTexture" id="wall-extra" src="media/login-scene/wall-extra.webp" alt="">
  <img class="lgTexture" id="wall-hero" src="media/login-scene/wall-hero.webp" alt="">
  <div class="lgWorld" id="world" aria-hidden="true"></div>
  <video id="atlas" class="lgAtlas" poster="media/login-scene/atlas-poster.jpg" muted loop playsinline preload="none" aria-hidden="true" tabindex="-1"></video>
  <header class="lgHeader">
    <div class="lgBrand"><img class="loginBrand" src="media/login-scene/talktide.webp" alt="Talktide" width="145" height="35"><span class="lgBrandRule"></span><span class="lgProduct"><span class="lgProductName">MMEA / APMM</span></span></div>
    <div class="loginLanguages" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="ms" aria-pressed="false">BM</button></div>
  </header>
  <section class="lgLogin" aria-labelledby="login-title">
    <div class="lgIntro"><p class="loginEyebrow" data-copy="eyebrow">MARITIME OPERATIONS</p><h1 id="login-title" data-copy="title">Connected assets.<br>Clear decisions.</h1><p class="lgSubbrand" data-copy="subtitle">Your command centre, connected.</p></div>
    <form id="login-form" novalidate>
      <div class="lgField"><label for="access-token" data-copy="label">Access token</label><div class="lgInputWrap">
        <svg class="lgFieldIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
        <input id="access-token" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off" aria-describedby="login-error" placeholder="Enter your access token">
        <button class="lgVisibility" id="visibility" type="button" aria-label="Show token" aria-pressed="false"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="eye-slash" d="m3 3 18 18" hidden/></svg></button>
      </div><p class="lgError" id="login-error" role="alert" hidden></p></div>
      <button class="lgSubmit" id="sign-in" type="submit"><span data-copy="submit">Enter command centre</span><span aria-hidden="true">→</span></button>
    </form>
  </section>
  <p class="lgFooter" data-copy="footer">Sea. Land. Air. One operational view.</p>
  <p class="lgCompany">Talktide · MMEA / APMM</p>
  <div class="lgControls">
    <button class="lgMotion" id="motion" type="button" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><span data-copy="pause">Pause motion</span></button>
    <button class="lgMotion" id="login-fullscreen" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span data-copy="fullscreen">Full screen</span></button>
  </div>
</main></div></body></html>
